name: 定时抓取 AQI 数据

on:
  schedule:
    # 每半小时一次（:15 和 :45，避开整点尖峰）
    - cron: '15,45 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 抓取 AQI 数据
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置同名 secret
          AQI_TOKEN: ${{ secrets.AQI_TOKEN }}
        run: node scripts/fetch-aqi.mjs

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/aqi.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新 AQI 数据"
            git push
          fi
